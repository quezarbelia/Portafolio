<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dataGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="dataGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="dataGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="100" height="100" rx="24" fill="#0b0d14" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Bars -->
  <circle cx="50" cy="50" r="30" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />

  <!-- 3 Analytics Data Bars (Bar Chart) -->
  <!-- Bar 1 -->
  <rect x="22" y="52" width="14" height="26" rx="5" fill="url(#dataGrad1)" />
  <!-- Bar 2 -->
  <rect x="43" y="36" width="14" height="42" rx="5" fill="url(#dataGrad2)" />
  <!-- Bar 3 -->
  <rect x="64" y="22" width="14" height="56" rx="5" fill="url(#dataGrad3)" />

  <!-- Ascending Trend Line with Glowing Nodes -->
  <path d="M 24 50 Q 48 34 74 18" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="74" cy="18" r="4.5" fill="#34d399" />
  <circle cx="74" cy="18" r="2.5" fill="#ffffff" />
</svg>
